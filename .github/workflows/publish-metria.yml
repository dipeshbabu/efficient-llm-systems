name: Release Metria

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact root Metria version"
        required: true
        default: "0.1.0"
        type: string
      publish:
        description: "Upload to PyPI (requires a tested release tag and environment review)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-metria-${{ github.ref }}-${{ inputs.version || '0.1.0' }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version || '0.1.0' }}

jobs:
  build:
    name: Build Metria release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
          prune-cache: true
      - name: Sync locked workspace
        run: uv sync --locked --all-packages
      - name: Validate release sources
        run: uv run --locked python tools/maintenance/check_metria_release.py --version "$RELEASE_VERSION"
      - name: Require tested main commit and matching tag for publication
        if: github.event_name == 'workflow_dispatch' && (inputs.publish || github.ref_type == 'tag')
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python tools/maintenance/check_metria_release.py --version "$RELEASE_VERSION" --publish
      - name: Test root package
        run: uv run --locked pytest metria_tests -q
      - name: Build wheel from source distribution
        run: uv run --locked python -m build --outdir dist/metria .
      - name: Check metadata, package boundaries, and setup assets
        run: |
          uv run --locked python -m twine check --strict dist/metria/*
          uv run --locked python tools/maintenance/check_wheel_contents.py dist/metria/*.whl
          uv run --locked python tools/maintenance/check_sdist_contents.py --metria-release dist/metria/*.tar.gz
          cd dist/metria
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Store distributions for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metria-${{ env.RELEASE_VERSION }}
          path: dist/metria/
          if-no-files-found: error
          retention-days: 30

  install:
    name: Install Metria / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-2025
            python: "3.13"
          - os: macos-15
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metria-${{ env.RELEASE_VERSION }}
          path: dist/metria/
      - name: Install wheel and source archive into separate clean environments
        shell: bash
        run: |
          set -euo pipefail
          for kind in wheel sdist; do
            python -m venv ".release-$kind"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              interpreter="$PWD/.release-$kind/Scripts/python.exe"
            else
              interpreter="$PWD/.release-$kind/bin/python"
            fi
            if [[ "$kind" == "wheel" ]]; then
              "$interpreter" -m pip install --no-deps dist/metria/*.whl
            else
              "$interpreter" -m pip install --no-deps dist/metria/*.tar.gz
            fi
            "$interpreter" -I tools/maintenance/check_metria_install.py --version "$RELEASE_VERSION"
          done

  publish:
    name: Publish Metria to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [build, install]
    runs-on: ubuntu-24.04
    environment:
      name: pypi-metria
      url: https://pypi.org/p/metria
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metria-${{ env.RELEASE_VERSION }}
          path: verified/
      - name: Verify reviewed hashes and stage only distributions
        run: |
          cd verified
          sha256sum --check SHA256SUMS
          mkdir ../dist
          cp -- *.whl *.tar.gz ../dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          verify-metadata: true
          attestations: true

  verify:
    name: Verify Metria from PyPI
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metria-${{ env.RELEASE_VERSION }}
          path: dist/metria/
      - name: Check published hashes and Trusted Publisher identity
        run: python tools/maintenance/verify_metria_pypi.py --version "$RELEASE_VERSION" --dist dist/metria > pypi-urls.txt
      - name: Verify signed attestations
        run: |
          while IFS= read -r url; do
            uvx --from pypi-attestations==0.0.29 pypi-attestations verify pypi \
              --repository https://github.com/dipeshbabu/metria "$url"
          done < pypi-urls.txt
      - name: Install and smoke-test the published package
        run: |
          python -m venv .pypi-smoke
          .pypi-smoke/bin/python -m pip install --index-url https://pypi.org/simple --no-cache-dir "metria==$RELEASE_VERSION"
          .pypi-smoke/bin/python -I tools/maintenance/check_metria_install.py --version "$RELEASE_VERSION"

  release:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metria-${{ env.RELEASE_VERSION }}
          path: dist/
      - name: Publish release notes and verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft=false --title "Metria $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Metria $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md"
          fi
