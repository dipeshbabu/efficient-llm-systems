# Root Metria framework and repository-level tool configuration.
#
# The root distribution is intentionally provisional and is not published by
# this repository. Focused components keep independent package/release lifecycles.

[project]
name = "metria"
version = "0.1.0.dev0"
description = "Evidence and experimentation framework for reproducible LLM inference systems studies."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.15"
authors = [
    { name = "Dipesh Tharu Mahato (dipeshbabu)" },
]
keywords = [
    "llm",
    "inference",
    "benchmarking",
    "evaluation",
    "reproducibility",
    "systems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dipeshbabu/metria"
Repository = "https://github.com/dipeshbabu/metria"
Issues = "https://github.com/dipeshbabu/metria/issues"

[project.scripts]
metria = "metria.cli:main"

[dependency-groups]
# Grouped maintenance-tool bumps are reviewed together with the workspace lockfile.
dev = [
    "build>=1.0",
    "coverage>=7.15.3",
    "mypy==2.3.1",
    "pre-commit>=4.6.1",
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "ruff>=0.16.1",
    "tomli>=2.0; python_version < '3.11'",
    "twine>=7.0.0",
    "types-requests>=2.28",
]

[tool.uv]
required-version = ">=0.11.8"
constraint-dependencies = [
    # GHSA-rrmf-rvhw-rf47 is fixed in PyTorch 2.13.0.
    "torch>=2.13",
    # PYSEC-2026-3447 is fixed in setuptools 83.0.0.
    "setuptools>=83",
]

[tool.uv.workspace]
members = [
    "components/kv-fidelity",
    "components/turboquant-reference",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["metria*"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = [
    "src",
    "components/kv-fidelity/src",
    "components/turboquant-reference/src",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    # Line wrapping is delegated to the formatter.
    "E501",
    # Keep Optional[T] stable for runtime annotation consumers.
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Package initializers may intentionally expose imports as public API.
"**/__init__.py" = ["F401"]

[tool.mypy]
files = [
    "src/metria",
    "components/kv-fidelity/src/kv_fidelity",
    "components/turboquant-reference/src/turboquant",
    "tools",
]
python_version = "3.10"
check_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = false
incremental = false
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional engine stacks are intentionally absent from the default workspace.
module = [
    "cffconvert",
    "cffconvert.*",
    "mlx",
    "mlx.*",
    "mlx_lm",
    "mlx_lm.*",
    "scipy",
    "scipy.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "vllm",
    "vllm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "metria_tests",
    "components/turboquant-reference/tests",
    "components/kv-fidelity/tests",
]
pythonpath = [
    "src",
    "components/turboquant-reference/src",
    "components/kv-fidelity/src",
]
markers = [
    "integration: requires external engines, models, or corpora",
]

[tool.coverage.run]
branch = true
source = ["turboquant", "kv_fidelity"]

[tool.coverage.report]
# The authoritative Ubuntu coverage job currently reports about 86.5% branch
# coverage, including platform-specific backend modules. Keep that baseline
# from regressing while reporting the gate at the same precision.
fail_under = 86
precision = 2
show_missing = true
skip_covered = true

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"
